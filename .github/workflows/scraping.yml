name: Scraping y sincronización

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '*/15 * * * *'
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué ejecutar'
        type: choice
        options:
          - todo
          - solo-rapido
          - solo-medio
          - solo-lento
        default: todo

concurrency:
  group: fantasy-scraping
  cancel-in-progress: false

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: Datos
          key: datos-fantasy-v4-${{ github.run_id }}
          restore-keys: datos-fantasy-v4-

      - name: Ingestar datos 1 (titularidad)
        if: github.event.schedule == '*/5 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.modo == 'todo' || inputs.modo == 'solo-rapido'))
        run: python "Scripts/Ingestar datos 1.py"

      - name: Ingestar datos estado (lesionados/sancionados)
        if: github.event.schedule == '*/5 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.modo == 'todo' || inputs.modo == 'solo-rapido'))
        run: python "Scripts/Ingestar datos estado.py"

      - name: Ingestar datos liga (API LaLiga Fantasy)
        if: github.event.schedule == '*/5 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.modo == 'todo' || inputs.modo == 'solo-rapido' || inputs.modo == 'solo-medio'))
        env:
          LALIGA_FANTASY_EMAIL: ${{ secrets.LALIGA_FANTASY_EMAIL }}
          LALIGA_FANTASY_PASSWORD: ${{ secrets.LALIGA_FANTASY_PASSWORD }}
          LALIGA_FANTASY_LEAGUE_ID: ${{ secrets.LALIGA_FANTASY_LEAGUE_ID }}
          LALIGA_FANTASY_TEAM_ID: ${{ secrets.LALIGA_FANTASY_TEAM_ID }}
        run: python "Scripts/Ingestar datos liga.py"

      - name: Ingestar datos 3 (calendario y alineaciones)
        if: github.event.schedule == '*/15 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.modo == 'todo' || inputs.modo == 'solo-medio'))
        run: python "Scripts/Ingestar datos 3.py"

      - name: Ingestar datos detalle (puntos por jugador y jornada)
        if: github.event.schedule == '*/15 * * * *' || (github.event_name == 'workflow_dispatch' && (inputs.modo == 'todo' || inputs.modo == 'solo-medio'))
        env:
          LALIGA_FANTASY_EMAIL: ${{ secrets.LALIGA_FANTASY_EMAIL }}
          LALIGA_FANTASY_PASSWORD: ${{ secrets.LALIGA_FANTASY_PASSWORD }}
        run: python "Scripts/Ingestar datos detalle.py"

      - name: Descargar imágenes
        if: github.event.schedule == '0 */5 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.modo == 'todo' || inputs.modo == 'solo-lento'))
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LALIGA_FANTASY_EMAIL: ${{ secrets.LALIGA_FANTASY_EMAIL }}
          LALIGA_FANTASY_PASSWORD: ${{ secrets.LALIGA_FANTASY_PASSWORD }}
          LALIGA_FANTASY_LEAGUE_ID: ${{ secrets.LALIGA_FANTASY_LEAGUE_ID }}
        run: python "Scripts/Descargar imágenes.py"

      - name: Sincronizar con Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python "Scripts/Sincronizar base de datos.py"

      - name: Notificar por Telegram
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python "Scripts/Notificar Telegram.py"

      - name: Avisar de fallo por Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Ha fallado la ejecución ${{ github.run_id }} del pipeline de Fantasy. Revisa los logs de GitHub Actions."
