name: Scraping y sincronización

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué ejecutar'
        type: choice
        options:
          - todo
          - solo-barato
          - solo-pesado
        default: todo

concurrency:
  group: fantasy-scraping
  cancel-in-progress: false

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: Datos
          key: datos-fantasy-${{ github.run_id }}
          restore-keys: datos-fantasy-

      - name: Ingestar datos liga (API LaLiga Fantasy)
        if: github.event.schedule == '0 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.modo != 'solo-pesado')
        env:
          LALIGA_FANTASY_EMAIL: ${{ secrets.LALIGA_FANTASY_EMAIL }}
          LALIGA_FANTASY_PASSWORD: ${{ secrets.LALIGA_FANTASY_PASSWORD }}
          LALIGA_FANTASY_LEAGUE_ID: ${{ secrets.LALIGA_FANTASY_LEAGUE_ID }}
        run: python "Scripts/Ingestar datos liga.py"

      - name: Ingestar datos 1 (titularidad)
        if: github.event.schedule == '0 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.modo != 'solo-pesado')
        run: python "Scripts/Ingestar datos 1.py"

      - name: Ingestar datos estado (lesionados/sancionados)
        if: github.event.schedule == '0 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.modo != 'solo-pesado')
        run: python "Scripts/Ingestar datos estado.py"

      - name: Ingestar datos 3 (calendario)
        if: github.event.schedule == '0 */5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.modo != 'solo-barato')
        run: python "Scripts/Ingestar datos 3.py"

      - name: Descargar imágenes
        if: github.event.schedule == '0 */5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.modo != 'solo-barato')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python "Scripts/Descargar imágenes.py"

      - name: Sincronizar con Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python "Scripts/Sincronizar base de datos.py"
